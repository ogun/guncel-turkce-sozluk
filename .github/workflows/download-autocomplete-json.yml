name: Download and push autocomplete.json
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download-autocomplete-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find JS bundle URL
        id: find_js
        run: |
          docker run --rm --user $(id -u):$(id -g) -v ${{ github.workspace }}:/workspace \
            lwthiker/curl-impersonate:0.6-chrome \
            curl-impersonate-chrome "https://sozluk.gov.tr/" -o /workspace/index.html
          JS_PATH=$(grep -oP '/assets/index-[A-Za-z0-9_-]+\.js' index.html | head -1)
          if [ -z "$JS_PATH" ]; then
            echo "::error::Could not find JS bundle URL in the page"
            exit 1
          fi
          echo "js_url=https://sozluk.gov.tr${JS_PATH}" >> $GITHUB_OUTPUT
          rm index.html
      - name: Download JS bundle and extract autocomplete JSON
        run: |
          docker run --rm --user $(id -u):$(id -g) -v ${{ github.workspace }}:/workspace \
            lwthiker/curl-impersonate:0.6-chrome \
            curl-impersonate-chrome "${{ steps.find_js.outputs.js_url }}" -o /workspace/bundle.js
          python3 .github/scripts/extract-autocomplete.py bundle.js sozluk/v12/src/v12.autocomplete.json
          rm bundle.js
      - name: Check if there are any changes
        id: verify_diff
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT
      - name: Commit autocomplete.json
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          sudo apt install --no-install-recommends -y gron
          git config diff.gron.textconv "f(){ gron --no-sort \$1 | sed -E 's/\\[[0-9]+\\]//g' | sed -E 's/^json = ..;$//g' ; }; f"
          git config user.name 'Github Actions'
          git config user.email 'github-actions@users.noreply.github.com'
          echo "Automated download" > commit_msg.txt
          echo "" >> commit_msg.txt
          git diff -w --unified=0 sozluk/v12/src/v12.autocomplete.json | sed -E 's/^@.*//g' | sed -E 's/^-$//g'  | sed -E 's/^$//g'  >> commit_msg.txt
          git add sozluk/v12/src/v12.autocomplete.json
          git commit -F commit_msg.txt
          git push
